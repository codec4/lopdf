$schema: 'https://moonrepo.dev/schemas/project.json'

# Quote & Note fork of lopdf, a submodule of the quote-and-note repository at packages/lopdf.
# qnn_document_analysis_native depends on it with default features off, so the checks run that
# configuration first and upstream's default configuration after it, both with the fork's
# lazy-reader feature. rust-check also builds without the feature.

language: 'rust'
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.toml'
  tests:
    - 'tests/**/*'
    - 'assets/**/*'

tasks:
  rust-test:
    # Without `set -e` only the last command's result would count.
    script: |
      set -e
      cargo test --no-default-features --features lazy-reader
      cargo test --features lazy-reader
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'

  rust-check:
    # Without `set -e` only the last command's result would count.
    script: |
      set -e
      cargo clippy --no-default-features --features lazy-reader --all-targets -- -D warnings
      cargo clippy --features lazy-reader --all-targets -- -D warnings
      cargo check --no-default-features
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'

  format:
    command: 'cargo fmt --check'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'

  pdfium-parity:
    # Compares page geometry and outline reading with pdfium, the library behind the Android PDF
    # renderer, on generated fixtures and assets/. Set QNN_PDF_CORPUS to folders of real PDFs,
    # separated by ':', to check them too. The first run downloads a pinned pdfium build into the
    # user cache, so this task is not part of rust-test or rust-check.
    script: |
      set -e
      pdfium=$(tools/pdfium-parity/fetch-pdfium.sh)
      cd tools/pdfium-parity
      cargo clippy --release --locked --all-targets -- -D warnings
      cargo fmt --check
      cargo run --release --locked -- --pdfium "$pdfium"
    inputs:
      - '@globs(sources)'
      - 'assets/**/*'
      - 'tools/pdfium-parity/**/*'
    env:
      QNN_PDF_CORPUS: '$QNN_PDF_CORPUS'
    options:
      cache: false
